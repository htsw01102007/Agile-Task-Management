<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng công việc (Tasks)</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      .board {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .column {
        background: #f1f3f5;
        border-radius: 8px;
        padding: 12px;
        width: 260px;
      }
      .column h3 {
        margin-top: 0;
        display: flex;
        justify-content: space-between;
      }
      .done-badge {
        font-size: 12px;
        color: #2b8a3e;
      }
      .task-card {
        background: #fff;
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      }
      .task-title {
        font-weight: 600;
        cursor: pointer;
      }
      .task-title[contenteditable="true"] {
        outline: 2px solid #4dabf7;
        border-radius: 4px;
      }
      .task-meta {
        font-size: 12px;
        color: #868e96;
        margin-top: 4px;
      }
      .quick-add {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .quick-add input {
        flex: 1;
      }
      .card-footer {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
      }
      .card-footer .btn-danger {
        margin-left: auto;
      }
      .assignees {
        display: flex;
        gap: 2px;
      }
      .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        object-fit: cover;
      }
      .avatar-letter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #4dabf7;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal {
        background: #fff;
        border-radius: 8px;
        padding: 16px;
        width: 320px;
      }
      .member-list label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
      }
      .filters input,
      .filters select {
        padding: 4px 6px;
      }
      .pagination {
        display: flex;
        gap: 4px;
        margin: 8px 0;
      }
      .pagination button {
        min-width: 32px;
      }
      .pagination button[disabled] {
        opacity: 0.5;
      }
      .pagination .current {
        font-weight: 700;
        text-decoration: underline;
      }
      .result-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px;
        border-bottom: 1px solid #eee;
      }
      .result-row .badge-high {
        color: #e03131;
        font-weight: 700;
      }
      .result-row .badge-urgent {
        color: #d9480f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Bảng công việc — Project #1</h1>

      <p>
        Đang đăng nhập với user ID:
        <input
          id="user-id"
          type="number"
          value="10"
          min="1"
          style="width: 70px"
        />
        (10 = manager; thử 11 = member, 12 = viewer để thấy bị chặn)
      </p>

      <!-- Thanh lọc + tìm + phân trang (chế độ danh sách) -->
      <details class="filter-bar" open>
        <summary>Lọc &amp; tìm task</summary>
        <form id="filter-form" class="filters">
          <input id="f-q" placeholder="Tìm từ khoá (tiêu đề/mô tả)" />
          <select id="f-priority">
            <option value="">Ưu tiên: tất cả</option>
            <option value="low">Thấp</option>
            <option value="medium">Trung bình</option>
            <option value="high">Cao</option>
            <option value="urgent">Khẩn cấp</option>
          </select>
          <select id="f-status">
            <option value="">Trạng thái: tất cả</option>
            <option value="open">Chưa xong</option>
            <option value="done">Hoàn thành</option>
          </select>
          <select id="f-assignee">
            <option value="">Người thực hiện: tất cả</option>
          </select>
          <label>Hạn từ <input id="f-due-after" type="date" /></label>
          <label>đến <input id="f-due-before" type="date" /></label>
          <button type="submit">Lọc</button>
          <button type="button" id="f-reset">Xoá lọc</button>
        </form>
        <div id="search-results"></div>
        <div id="pagination" class="pagination"></div>
      </details>

      <div id="board" class="board"></div>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pages/tasks.js"></script>
  </body>
</html>
