<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng công việc (Tasks)</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      .board {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .column {
        background: #f1f3f5;
        border-radius: 8px;
        padding: 12px;
        width: 260px;
      }
      .column h3 {
        margin-top: 0;
        display: flex;
        justify-content: space-between;
      }
      .done-badge {
        font-size: 12px;
        color: #2b8a3e;
      }
      .task-card {
        background: #fff;
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      }
      .task-title {
        font-weight: 600;
        cursor: pointer;
      }
      .task-title[contenteditable="true"] {
        outline: 2px solid #4dabf7;
        border-radius: 4px;
      }
      .task-meta {
        font-size: 12px;
        color: #868e96;
        margin-top: 4px;
      }
      .quick-add {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .quick-add input {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Bảng công việc — Project #1</h1>

      <p>
        Đang đăng nhập với user ID:
        <input
          id="user-id"
          type="number"
          value="10"
          min="1"
          style="width: 70px"
        />
        (10 = manager; thử 11 = member, 12 = viewer để thấy bị chặn)
      </p>

      <div id="board" class="board"></div>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pages/tasks.js"></script>
  </body>
</html>
