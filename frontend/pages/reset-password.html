<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt lại mật khẩu | Agile Workspace</title>
    <link rel="icon" href="../assets/images/logo.svg" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-root="../">
    <div id="app">
      <header id="app-header" class="hdr"></header>
      <aside id="app-sidebar" class="side"></aside>
      <main class="page-content auth-page" id="main-content">
        <section class="auth-card" aria-labelledby="reset-title">
          <span class="mark auth-mark">A</span>
          <h1 id="reset-title">Đặt mật khẩu mới</h1>
          <p class="muted">Liên kết có hiệu lực trong thời gian giới hạn.</p>
          <form id="reset-form">
            <label for="new-password">Mật khẩu mới</label>
            <input
              id="new-password"
              name="new_password"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
            <small
              >Tối thiểu 8 ký tự, bao gồm chữ hoa, chữ thường và chữ số.</small
            >
            <button id="reset-submit" class="btn btn-primary" type="submit">
              Cập nhật mật khẩu
            </button>
          </form>
          <p
            id="reset-result"
            class="muted"
            role="status"
            aria-live="polite"
          ></p>
          <p class="auth-switch"><a href="login.html">Quay lại đăng nhập</a></p>
        </section>
      </main>
    </div>
    <div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/reset-password.js"></script>
  </body>
</html>
