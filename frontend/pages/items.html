<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Items Mẫu | Agile Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body data-root="../">
  <div id="app">
    <header id="app-header" class="hdr"></header>
    <aside id="app-sidebar" class="side"></aside>

    <main class="page-content" id="main-content">
      <nav class="crumb" aria-label="Breadcrumb">
        <a href="../index.html">Không gian làm việc</a>
        <span>›</span>
        <span>Items</span>
      </nav>

      <div class="page-heading">
        <div>
          <p class="eyebrow">CÔNG CỤ MẪU</p>
          <h1>Quản lý Items</h1>
          <p class="muted">Trang minh họa thao tác CRUD kết nối trực tiếp với REST API Backend.</p>
        </div>
      </div>

      <div class="layout-2col">
        <section class="content-panel">
          <h2 id="form-title">Thêm item mới</h2>
          <form id="item-form" novalidate>
            <label for="name">Tên item *</label>
            <input id="name" name="name" type="text" required maxlength="255" placeholder="VD: Gói dịch vụ Enterprise">

            <label for="price">Giá trị (VNĐ)</label>
            <input id="price" name="price" type="number" min="0" step="1000" placeholder="0">

            <label for="description">Mô tả chi tiết</label>
            <textarea id="description" name="description" rows="3" placeholder="Ghi chú thêm (không bắt buộc)…"></textarea>

            <div class="form-actions">
              <button id="btn-submit" type="submit" class="btn btn-primary">Thêm mới</button>
              <button id="btn-cancel" type="button" class="btn" hidden>Huỷ</button>
            </div>
          </form>
        </section>

        <section class="content-panel">
          <div class="list-header">
            <div>
              <h2>Danh sách Items</h2>
              <p class="muted">Tìm kiếm, chỉnh sửa hoặc xoá dữ liệu mẫu.</p>
            </div>
            <input id="search-input" type="search" placeholder="Tìm theo tên…" aria-label="Tìm item">
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tên &amp; Mô tả</th>
                  <th class="text-right">Giá trị</th>
                  <th>Ngày tạo</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="item-table-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/items.js"></script>
</body>

</html>
