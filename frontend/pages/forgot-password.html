<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu | Agile Workspace</title>
    <link rel="icon" href="../assets/images/logo.svg" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-root="../">
    <div id="app">
      <header id="app-header" class="hdr"></header>
      <aside id="app-sidebar" class="side"></aside>
      <main class="page-content auth-page" id="main-content">
        <section class="auth-card" aria-labelledby="forgot-title">
          <span class="mark auth-mark">A</span>
          <h1 id="forgot-title">Quên mật khẩu?</h1>
          <p class="muted">Nhập email để nhận liên kết đặt lại mật khẩu.</p>
          <form id="forgot-form">
            <label for="email">Địa chỉ Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
            <button id="forgot-submit" class="btn btn-primary" type="submit">
              Gửi hướng dẫn
            </button>
          </form>
          <p
            id="forgot-result"
            class="muted"
            role="status"
            aria-live="polite"
          ></p>
          <p class="auth-switch"><a href="login.html">Quay lại đăng nhập</a></p>
        </section>
      </main>
    </div>
    <div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/forgot-password.js"></script>
  </body>
</html>
