# Nội suy ${DB_*} từ .env thư mục gốc: docker compose --env-file ../.env up
services:
  db:
    image: mysql:8.0
    container_name: task_management_mysql
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in the project .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network

  backend:
    build: .
    container_name: task_management_backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in the project .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the project .env}
    ports:
      - "8000:8000"
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge

